<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <title>Memlane · 记忆归整</title>
  <desc>小圆点、四个小方块与一个大方块，在统一网格内组成正方形，表达记忆由碎片归整为知识。</desc>
  <rect x="5" y="5" width="90" height="90" rx="20" fill="#000000"/>
  <g fill="#ffffff">
    <rect x="21" y="21" width="37" height="37" rx="5"/>
    <rect x="63" y="21" width="16" height="16" rx="3"/>
    <rect x="63" y="42" width="16" height="16" rx="3"/>
    <rect x="21" y="63" width="16" height="16" rx="3"/>
    <rect x="42" y="63" width="16" height="16" rx="3"/>
    <circle cx="66.5" cy="66.5" r="3.5"/>
    <circle cx="75.5" cy="66.5" r="3.5"/>
    <circle cx="66.5" cy="75.5" r="3.5"/>
    <circle cx="75.5" cy="75.5" r="3.5"/>
  </g>
</svg>

# Enola 0.4.30 exact official Config.Default().Ignore + installedFileGlobs().
# Source: https://raw.githubusercontent.com/enola-labs/enola/v0.4.30/internal/config/config.go
# Preserves default ignore order and duplicate entries.
# The official manifests extractor bypasses ignore and recursively scans build/.
# Keep every other default extractor; manifest-derived SBOM facts are unavailable.
extractors:
  - asyncapi
  - cpp
  - dart
  - dotnet
  - go
  - grpc
  - java
  - kotlin
  - openapi
  - php
  - python
  - typescript
  - swift
  - ruby
  - rust
  - scala
  - hcl
  - ansible
  - mdintent
ignore:
  - "**/vendor/**"
  - "**/node_modules/**"
  - "**/.git/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/tmp/**"
  - "**/public/assets/**"
  - "**/testdata/**"

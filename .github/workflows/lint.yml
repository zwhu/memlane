name: Static Lint Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run zero-dependency Memlane lint
        run: python3 -B scripts/lint.py
      - name: Run scripts unit tests
        run: python3 -B -m unittest discover -s scripts -p "test_*.py" -v
      - name: Run stdlib-only engine unit tests
        run: >-
          PYTHONPATH=engine/python python3 -B -m unittest -v
          test_agent_environments test_cursor_connection test_first_install_mode
          test_first_install_store test_generation_parameters test_generation_restart
          test_generation_startup test_log_tailer test_official_service_dev
          test_opencode_installation test_owner_lifecycle test_plugin_hook_helpers
          test_project_plugin_policy test_reading_state_store test_registry_sessions_store
          test_runtime_common test_session_relations test_sqlite_ro

  go-test:
    runs-on: macos-latest
    env:
      GOPATH: ${{ github.workspace }}/.local/gopath
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        run: go mod download
      - name: Run Go vet
        run: python3 -B scripts/mygo_sdk.py --exec "$(command -v go)" vet ./...
      - name: Run Go tests
        run: python3 -B scripts/mygo_sdk.py --exec "$(command -v go)" test -count=1 ./...

name: Publish Memlane website

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published Memlane release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify release and prepare website
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$RELEASE_TAG")" = false
          gh release download --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/memlane-release" \
            --pattern "Memlane-${RELEASE_TAG#v}-arm64.dmg" --pattern SHA256SUMS.txt -- "$RELEASE_TAG"
          python3 web/prepare_release_site.py "$RELEASE_TAG" "$RUNNER_TEMP/memlane-release" "$RUNNER_TEMP/memlane-site" \
            --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/memlane-site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4

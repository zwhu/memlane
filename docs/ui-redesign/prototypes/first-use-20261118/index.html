t:70px;flex:none;border-top:1px solid #eceef1;display:flex;align-items:center;padding:0 38px;gap:12px;background:#fff}.foot .hint{font-size:11px;color:#9298a2;flex:1}.foot .hint i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#6b9b84;margin-right:7px}.help{font-size:11px;color:#8a919b}.topsteps{display:none}.notice{font-size:11px;color:#8d939c;margin-top:17px;display:flex;gap:8px;align-items:center}.notice span{font-size:16px}.switcher{position:fixed;bottom:19px;left:50%;transform:translateX(-50%);background:#252a32;box-shadow:0 7px 25px #161c2333;border-radius:12px;color:#fff;display:flex;align-items:center;padding:7px;gap:10px;z-index:20;font-size:12px}.switcher button{color:#fff;border-radius:7px;padding:9px 12px}.switcher button:hover{background:#ffffff16}.switcher label{min-width:215px;text-align:center}.switcher small{font-size:10px;color:#aeb5c0;margin:0 12px}.agent{display:flex;align-items:center;padding:20px 18px;gap:13px;border-bottom:1px solid #eceef1}.agent:last-child{border:0}.agent .avatar{width:35px;height:35px;border-radius:8px;border:1px solid #e5e7eb;display:grid;place-items:center;font-size:16px}.agent p{font-size:11px;margin-top:5px}.agent .outline{margin-left:auto}.method{display:flex;gap:13px;padding:17px 18px;border-bottom:1px solid #eceef1;cursor:pointer}.method.active{background:#f5f7fc}.radio{width:15px;height:15px;border:1px solid #d6dbe4;border-radius:50%;margin-top:2px}.method.active .radio{border:4px solid #5371c4}.method p{font-size:11px;margin-top:5px}.field{margin-top:20px;border-top:1px solid #eceef1;padding-top:20px}.field label{display:block;font-size:11px;margin-bottom:9px;color:#7f8691}.select{border:1px solid #e1e4e9;border-radius:7px;padding:12px;font-size:12px;display:flex;justify-content:space-between}.success{padding:11px 14px;background:#f0f7f3;color:#5b806d;font-size:12px;border-radius:7px;margin-top:17px}.variant-b .rail{display:none}.variant-b .workspace{margin:0 18px 18px;border:1px solid #e2e4e8;border-radius:13px}.variant-b .topsteps{display:flex;align-items:center;gap:22px;padding:23px 38px;border-bottom:1px solid #eceef1}.topsteps .step{padding:0;background:none}.topsteps .step small{display:none}.topsteps .connector{width:74px;height:1px;background:#e5e7eb}.variant-b .content{padding-top:28px}.variant-b .layout{grid-template-columns:minmax(0,1fr) 310px;gap:35px}.variant-b .groups{border:0}.variant-b .group-head{padding-left:0;padding-right:0}.variant-b .dep{padding-left:0;padding-right:0}.variant-b .panel{background:#f6f7f9;padding:26px}.variant-c .rail{display:none}.variant-c .workspace{margin:0 18px 18px;border:1px solid #e2e4e8;border-radius:13px}.variant-c .content{padding:29px 34px}.variant-c .topsteps{display:flex;gap:30px;margin:0 34px;padding:22px 0;border-bottom:1px solid #eceef1}.variant-c .topsteps .connector{display:none}.variant-c .layout{display:block}.variant-c .groups{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border:0;border-radius:0;overflow:visible}.variant-c .group{border:1px solid #e5e7eb;border-radius:10px;min-height:220px;padding-bottom:9px}.variant-c .group-head{padding:19px 17px 13px;flex-wrap:wrap;gap:7px}.variant-c .group-head small{width:100%}.variant-c .dep{height:51px}.variant-c .status{display:none}.variant-c .panel{margin-top:20px;display:flex;align-items:center;gap:22px;padding:19px 22px}.variant-c .panel .big{margin:0;font-size:21px;white-space:nowrap}.variant-c .panel hr,.variant-c .panel .mini,.variant-c .panel .text{display:none}.variant-c .panel .primary{margin:0 0 0 auto;width:auto;white-space:nowrap}.variant-c .panel h3{display:none}.variant-c .section-head{margin-top:25px}.variant-c .only-list{display:block}.variant-c .only-list .group{min-height:0}.variant-c .only-list .status{display:block}.overlay{position:fixed;inset:0;background:#222a384d;display:grid;place-items:center;z-index:15;backdrop-filter:blur(3px)}.modal{width:680px;background:white;border:1px solid #dde1e7;border-radius:15px;box-shadow:0 28px 120px #17233744;overflow:hidden}.modal-head{padding:25px 28px 20px;display:flex;align-items:start;justify-content:space-between}.modal-head h2{font-size:20px}.modal-head p{font-size:12px;margin-top:8px}.modal-body{padding:0 28px 20px;max-height:430px;overflow:auto}.planrow{display:grid;grid-template-columns:28px 1fr 85px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eceef1;font-size:12px}.planrow small{display:block;margin-top:5px;font-size:10px}.planrow>span:last-child{text-align:right;color:#828995;font-size:11px}.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:19px 28px;border-top:1px solid #eceef1;background:#fafbfc}.path{padding:13px;background:#f6f7f9;border-radius:7px;font-size:10px;color:#8b939f;line-height:1.8;margin-top:15px}.demo-action{padding:6px 10px;border:1px solid #ffffff30!important;color:#d6e6ff!important;font-size:10px!important}.empty{padding:40px 22px;text-align:center}
</style>
<div id="app"></div><div id="modal"></div>
<script>
const variants=['A','B','C'],names=['侧边步骤导航','顶部步骤 · 双栏','模块总览'];
let variant=new URLSearchParams(location.search).get('variant')||'A',step=0,ready=false,busy=false,chosen='',method='pi',verified=false,enabled=false;
const deps=[['uv','0.12.3','uv','安装工具'],['Python','3.12.12','python','Python 运行环境'],['运行库','LanceDB 0.39.0 · FastEmbed 0.9.1','generic','引擎运行依赖'],['Cognee','1.6.7 · ec6f408','cognee','记忆引擎'],['向量模型','BGE Small ZH v1.5','huggingface','本地检索模型'],['Agent 插件','1.8.0 · a176248','cognee','自动保存与召回']];
const img=(name)=>name==='generic'?'<span class="icon generic">▤</span>':`<img class="icon" src="${name}.svg" alt="">`;
function steps(){return ['准备环境','连接 Agent','配置记忆处理'].map((s,i)=>`${i?'<span class="connector"></span>':''}<button class="step ${step===i?'active':''}" onclick="go(${i})"><span class="num">${i<step?'✓':'0'+(i+1)}</span><span><b>${s}</b><small>${['运行本地记忆服务','接入日常编码工具','选择整理记忆的模型'][i]}</small></span></button>`).join('')}
function row(d){return `<div class="dep">${img(d[2])}<div><div class="dep-name">${d[0]}</div><div class="version">${d[1]}</div></div><span class="status ${ready?'good':''}">${ready?'可用':busy?'等待安装':'待安装'}</span></div>`}
function groups(){return [[0,3,'运行基础','Python 与运行依赖'],[3,5,'本地记忆引擎','整理与检索'],[5,6,'Agent 接入','保存与召回']].map(([a,b,title,sub])=>`<section class="group"><div class="group-head"><h3>${title}</h3><small>${sub}</small></div>${deps.slice(a,b).map(row).join('')}</section>`).join('')}
function panel(){return `<aside class="panel"><h3>${ready?'环境已就绪':busy?'正在准备环境':'准备概览'}</h3><div class="big">${ready?'全部可用':busy?'安装中':'6 个组件'}</div><p>${ready?'接下来连接你日常使用的编码 Agent。':busy?'逐项显示安装结果，可随时停止。':'先检测已有环境，仅安装缺少的组件。'}</p><hr><div class="mini"><span>安装位置</span><span>当前用户目录</span></div><div class="mini"><span>需要管理员权限</span><span>否</span></div><button class="primary" onclick="${ready?'go(1)':busy?'stopInstall()':'review()'}">${ready?'继续连接 Agent':busy?'停止安装':'查看安装计划'} <span>→</span></button>${!ready&&!busy?'<button class="text" onclick="details()">指定已有环境</button>':''}</aside>`}
function environment(){return `<div class="eyebrow">开始使用 / 01</div><h1>准备好你的本地记忆环境</h1><p class="lead">记忆留在你的电脑上，已有的兼容组件直接复用。</p><div class="section-head"><h2>运行环境</h2><button class="text" onclick="render()">↻　重新检测</button></div><div class="layout"><div class="groups">${groups()}</div>${panel()}</div><div class="notice"><span>⌁</span> 具体版本、下载来源和安装位置，会在安装前统一确认。</div>`}
function agents(){return `<div class="eyebrow">开始使用 / 02</div><h1>连接你正在使用的 Agent</h1><p class="lead">接入后，Agent 可以保存经验，并在后续任务中找回记忆。</p><div class="section-head"><h2>这台电脑上的 Agent</h2><button class="text" onclick="details()">批量连接</button></div><div class="layout"><div class="groups only-list">${[['Codex','编码与项目协作','◎'],['pi','轻量终端 Agent','π'],['Trae','编码助手','↗']].map(([n,t,i])=>`<div class="agent"><span class="avatar">${i}</span><div><h3>${n}</h3><p>${t}</p></div><button class="outline" onclick="chosen='${n}';render()">${chosen===n?'已选择 ✓':'连接'}</button></div>`).join('')}</div><aside class="panel"><h3>连接 Agent</h3><div class="big">${chosen||'选择一个'}</div><p>${chosen?'连接前可以审阅将要安装的插件和执行权限。':'使用 Agent 已有账号，按需安装记忆插件。'}</p><hr><div class="mini"><span>当前选择</span><span>${chosen||'尚未选择'}</span></div><button class="primary" onclick="go(2)">继续配置记忆处理 →</button><button class="text" onclick="go(2)">稍后连接</button></aside></div>`}
function processing(){return `<div class="eyebrow">开始使用 / 03</div><h1>选择如何整理记忆</h1><p class="lead">连接 Agent 与处理记忆分别配置，你可以使用已有账号或自配模型。</p><div class="section-head"><h2>记忆处理方式</h2></div><div class="layout"><div><div class="groups only-list">${[['pi','已连接的 Agent','使用 pi 的账号与模型'],['provider','自配模型服务','填写 API 地址与密钥'],['gateway','Magpie 网关','使用本机已配置的网关']].map(([id,n,t])=>`<div class="method ${method===id?'active':''}" onclick="method='${id}';verified=false;enabled=false;render()"><span class="radio"></span><div><h3>${n}</h3><p>${t}</p></div></div>`).join('')}</div><div class="field"><label>${method==='pi'?'当前模型':'模型配置'}</label><div class="select">${method==='pi'?'pi · DeepSeek V4 Flash':method==='provider'?'添加模型服务':'检测本机 Magpie'}<span>⌄</span></div></div>${verified?'<div class="success">✓　验证通过，可以设为当前使用。</div>':''}</div><aside class="panel"><h3>当前状态</h3><div class="big">${enabled?'已启用':verified?'验证通过':'尚未启用'}</div><p>先保存并验证，再明确设为当前使用。</p><hr><div class="mini"><span>选择方式</span><span>${method==='pi'?'pi':method==='provider'?'自配模型':'Magpie'}</span></div><button class="primary" onclick="${verified?'enabled=true;render()':'verified=true;render()'}">${enabled?'已设为当前使用 ✓':verified?'设为当前使用':'保存并验证'}</button></aside></div>`}
function render(){document.getElementById('app').innerHTML=`<div class="window variant-${variant.toLowerCase()}"><div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><div class="brand"><span class="mark">◎</span> Memlane</div><span class="preview">交互预览 · 示例状态</span></div><div class="shell"><aside class="rail"><h2>设置 Memlane</h2><p class="intro">三个步骤，开始积累记忆</p><nav class="steps">${steps()}</nav><div class="rail-bottom">设置会保留当前进度。<br>以后也能在设置中调整。</div></aside><main class="workspace"><nav class="topsteps">${steps()}</nav><div class="content">${[environment,agents,processing][step]()}</div><footer class="foot"><button class="help" onclick="details()">帮助与诊断 ↗</button><span class="hint">${step===0?'<i></i>只安装你确认的组件':'选择与启用分别保存'}</span>${step>0?'<button class="outline" onclick="go(step-1)">上一步</button>':''}${step===2?`<button class="primary" ${!enabled?'disabled':''} onclick="finish()">开始使用 Memlane →</button>`:''}</footer></main></div></div><div class="switcher"><button aria-label="上一方案" onclick="cycle(-1)">←</button><label>${variant} · ${names[variants.indexOf(variant)]}</label><button aria-label="下一方案" onclick="cycle(1)">→</button><small>布局预览</small>${busy?'<button class="demo-action" onclick="busy=false;ready=true;render()">模拟安装完成</button>':''}</div>`}
function go(i){step=i;render()}function cycle(d){variant=variants[(variants.indexOf(variant)+d+3)%3];let u=new URL(location);u.searchParams.set('variant',variant);history.replaceState({},'',u);render()}
function closeModal(){document.getElementById('modal').innerHTML=''}
function review(){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="modal"><div class="modal-head"><div><h2>确认安装计划</h2><p>仅准备以下缺失组件，已有环境保持原样。</p></div><button onclick="closeModal()">✕</button></div><div class="modal-body">${deps.map((d,i)=>`<div class="planrow">${img(d[2])}<div>${d[0]} <small>${d[1]} · ${d[3]}</small></div><span>${i===0?'16.9 MiB':i===1?'16.8 MiB':i===4?'91.2 MiB':'查看明细'}</span></div>`).join('')}<div class="path">安装到当前用户的 Memlane 组件目录。<br>来源：Astral / Cognee / Hugging Face 官方固定版本。<br>这是设计演示，按钮不会下载文件或修改电脑。</div></div><div class="modal-foot"><button class="outline" onclick="closeModal()">暂不安装</button><button class="primary" onclick="closeModal();busy=true;render()">确认安装 · 演示</button></div></section></div>`}
function details(){document.getElementById('modal').innerHTML='<div class="overlay"><section class="modal"><div class="modal-head"><div><h2>环境与诊断</h2><p>次要操作在独立面板内完成，不撑开引导主页面。</p></div><button onclick="closeModal()">✕</button></div><div class="modal-body"><div class="path">这里保留：指定已有路径、逐组件来源与位置、复制排查提示词、导出脱敏诊断包。<br>当前仅展示信息层级，不执行真实操作。</div></div><div class="modal-foot"><button class="outline" onclick="closeModal()">关闭</button></div></section></div>'}
function stopInstall(){busy=false;render()}function finish(){document.getElementById('modal').innerHTML='<div class="overlay"><section class="modal"><div class="modal-head"><div><h2>准备完成</h2><p>设计演示到此结束，实际产品会进入日常首页。</p></div></div><div class="modal-foot"><button class="primary" onclick="closeModal();step=0;ready=false;verified=false;enabled=false;render()">回到首次使用预览</button></div></section></div>'}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowRight')cycle(1);if(e.key==='ArrowLeft')cycle(-1);if(e.key==='Escape')closeModal()});render();
</script></html>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1160" viewBox="0 0 1600 1160"><rect x="0" y="0" width="1600" height="1160" rx="0" fill="#f1f4f7"/><text x="32" y="40" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600">项目页状态与交互补充</text><text x="32" y="65" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">人工示例 · 状态是设计要求，不代表数据存在或接口已交付</text><rect x="32" y="94" width="744" height="430" rx="12" fill="white" stroke="#e5ebf1"/><text x="54" y="126" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">原始记录 · 会话与文档</text><rect x="800" y="94" width="768" height="430" rx="12" fill="white" stroke="#e5ebf1"/><text x="822" y="126" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">图谱 · 复用官方画布</text><rect x="32" y="548" width="744" height="260" rx="12" fill="white" stroke="#e5ebf1"/><text x="54" y="580" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">空内容 / 首次读取 / 刷新失败</text><rect x="800" y="548" width="768" height="260" rx="12" fill="white" stroke="#e5ebf1"/><text x="822" y="580" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">搜索 · 初始态 / 无匹配 / 失败</text><rect x="32" y="832" width="744" height="280" rx="12" fill="white" stroke="#e5ebf1"/><text x="54" y="864" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">长标题与项目菜单</text><rect x="800" y="832" width="768" height="280" rx="12" fill="white" stroke="#e5ebf1"/><text x="822" y="864" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="600">返回与键盘</text><text x="56" y="159" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="600">原始记录</text><text x="152" y="159" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="400">全部   会话   文档</text><rect x="52" y="178" width="216" height="76" rx="7" fill="#edf3f9"/><text x="65" y="202" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="500">说明 slug 功能与边界</text><text x="65" y="229" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" font-weight="400">会话 · 已载入范围</text><text x="295" y="164" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="600">说明 slug 功能与边界</text><text x="295" y="188" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" font-weight="400">会话 · 11月13日 15:19 · 已载入 2 轮</text><path d="M292 204 L752 204" fill="none" stroke="#e5ebf1"/><text x="298" y="232" fill="#426683" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600">用户</text><text x="298" y="255" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">解释 formatSlug 的功能与适用边界。</text><text x="298" y="291" fill="#426683" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="600">Agent</text><text x="298" y="315" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">formatSlug 将标题转换为可用于路径的短标识。</text><text x="298" y="337" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">保留官方 Markdown 与代码格式。</text><rect x="296" y="365" width="435" height="36" rx="6" fill="#f7f9fb" stroke="#e5ebf1"/><text x="310" y="388" fill="#426683" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="400">› 工具记录  ·  read_file</text><text x="55" y="452" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">会话按角色与轮次阅读，工具默认折叠；文档显示 Markdown。</text><text x="55" y="476" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">不把“已载入”说成完整历史；从出处进入时显示“返回知识”。</text><text x="824" y="159" fill="#426683" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="500">实体关系     代码图谱</text><text x="824" y="193" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="600">代码图谱尚未开启</text><text x="824" y="226" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">按项目显式开启；显示实际处理状态。</text><text x="824" y="250" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">开启与更新需要明确操作，不随访问自动执行。</text><rect x="824" y="282" width="125" height="34" rx="7" fill="#edf3f9"/><text x="840" y="304" fill="#426683" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">开启代码图谱</text><rect x="824" y="342" width="717" height="103" rx="7" fill="#f7f9fb" stroke="#e5ebf1"/><text x="844" y="370" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">已开启时：此处承载 Cognee 官方画布。</text><text x="844" y="394" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">保留官方缩放、选择与详情，不自绘示例节点。</text><text x="844" y="418" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="400">图谱页在导航栏右侧使用整片工作区，不留空列表栏。</text><text x="56" y="615" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">首次读取：骨架与“正在读取”，不先报 0。</text><text x="56" y="653" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">成功真空：此项目暂无知识；可切到原始记录。</text><text x="56" y="691" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">刷新失败：保留原内容，“未刷新 · 重试”，详情收进诊断。</text><text x="56" y="729" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">明确失效：撤下正文与复制，提供返回有效列表。</text><text x="824" y="615" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">初始：输入关键词；可列当前会话最近浏览，不发检索请求。</text><text x="824" y="653" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">无匹配：当前范围未找到；清除筛选 / 切换全部项目。</text><text x="824" y="691" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">失败：无法完成本次搜索；保留输入与范围，Enter 重试。</text><text x="824" y="729" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">检索中：显示状态，旧结果标“上次结果”，不冒充新命中。</text><text x="56" y="898" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">长标题最多三行：展开完整标题 / 收起。</text><text x="56" y="934" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">全文展开只改变标题区域，不缩小字号。</text><text x="56" y="970" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">右上项目菜单：项目设置、查看项目路径。</text><text x="56" y="1006" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">切换项目以稳定项目 ID 为准，同名项目显示路径。</text><text x="56" y="1042" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">列表项两行标题 + 类型 / 时间；选中项保持可见。</text><text x="824" y="898" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">项目 → 知识 → 出处 → 返回知识 → 返回原位置。</text><text x="824" y="934" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">搜索结果 → 详情 → 返回搜索：词、范围、选择与滚动保留。</text><text x="824" y="970" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">Esc 关闭顶层浮层；Tab 留在搜索框或信息浮层内。</text><text x="824" y="1006" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">搜索 ↑↓ 导航；输入后 Enter 检索，结果就绪后 Enter 打开。</text><text x="824" y="1042" fill="#273340" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" font-weight="400">切换项目 / 范围取消旧请求；迟到结果不得覆盖新视图。</text><text x="32" y="1142" fill="#7c8da0" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="10" font-weight="400">设计提案 · 图片与 SVG 为同一源稿导出 · 不含 CSS / HTML 交互原型</text></svg>
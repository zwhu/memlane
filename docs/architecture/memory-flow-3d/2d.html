<title>Memlane × Cognee · 2D 动画讲解（Canvas 60fps）</title>
<style>
:root {
  --paper: #f6f1e8;
  --glass: rgba(252, 249, 243, 0.86);
  --glass-strong: rgba(255, 253, 249, 0.94);
  --border: rgba(120, 104, 82, 0.16);
  --ink: #22201d;
  --muted: #686156;
  --subtle: #968d7f;
  --accent: #d06542;
  --accent-soft: rgba(208, 101, 66, 0.12);
  --green: #2c835d;
  --green-soft: rgba(44, 131, 93, 0.13);
  --serif: Georgia, "Songti SC", "Noto Serif SC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; user-select: none; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#stage:active { cursor: grabbing; }

/* Top HUD */
.hud-top {
  position: fixed; top: 16px; left: 18px; right: 18px; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.brand-pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 7px 14px 7px 9px; border-radius: 99px;
  background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(34,26,16,0.06);
}
.brand-pill img { width: 24px; height: 24px; border-radius: 6px; }
.brand-pill h1 { margin: 0; font: 600 14.5px/1 var(--serif); letter-spacing: -0.01em; }
.phase-badge {
  font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent);
}
body.recall .phase-badge { background: var(--green-soft); color: var(--green); }
.nollm-badge {
  display: none; align-items: center; gap: 5px;
  padding: 6px 13px; border-radius: 99px;
  background: rgba(44, 131, 93, 0.92); color: #fff;
  font-size: 12px; font-weight: 650;
  box-shadow: 0 8px 22px rgba(44, 131, 93, 0.24);
}
body.recall .nollm-badge { display: inline-flex; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.chip-btn {
  display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  padding: 7px 13px; border-radius: 99px;
  background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border); color: var(--ink); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: border-color 140ms, background 140ms, transform 140ms;
}
.chip-btn:hover { border-color: var(--accent); background: var(--glass-strong); }
.chip-btn:active { transform: scale(0.96); }
.chip-btn.on { background: var(--ink); color: #faf7f2; border-color: var(--ink); }
.hint-pan { font-size: 11.5px; color: var(--muted); padding: 6px 11px; border-radius: 99px; background: rgba(252,249,243,0.68); border: 1px solid var(--border); }

/* Bottom Cinema Deck */
.cinema-deck {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
  width: min(960px, calc(100vw - 28px)); z-index: 20;
  background: var(--glass-strong); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border); border-radius: 22px;
  box-shadow: 0 18px 48px rgba(34, 26, 16, 0.11), 0 2px 8px rgba(34, 26, 16, 0.05);
  padding: 13px 18px 12px;
}
.sub-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sub-title { font: 700 17px/1.3 var(--serif); color: var(--ink); }
.sub-step { font: 700 11px/1 var(--mono); padding: 3px 8px; border-radius: 99px; background: var(--accent); color: #fff; vertical-align: 2px; }
body.recall .sub-step { background: var(--green); }
.sub-body { margin: 5px 0 0; font-size: 14px; line-height: 1.62; color: #3d3933; }
.sub-tip {
  margin-top: 6px; padding: 5px 10px; border-radius: 10px;
  background: rgba(236, 229, 216, 0.55); font-size: 12.5px; line-height: 1.5; color: var(--muted);
}
.sub-tip:empty { display: none; }
.sub-tip b { color: var(--ink); }
.sub-tech { display: none; margin-top: 5px; font: 11.5px/1.45 var(--mono); color: var(--subtle); }
body.tech .sub-tech { display: block; }

.player-bar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.pbtn {
  border: 1px solid var(--border); background: #fff; color: var(--ink);
  border-radius: 99px; height: 34px; padding: 0 13px; font-size: 13px; font-weight: 650;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  transition: transform 140ms, border-color 140ms, background 140ms;
}
.pbtn:hover { border-color: var(--accent); }
.pbtn:active { transform: scale(0.95); }
.pbtn.primary { background: var(--ink); color: #faf7f2; border-color: var(--ink); min-width: 88px; }
.pbtn.icon { width: 34px; padding: 0; }

.scrubber-wrap { flex: 1; position: relative; height: 26px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.scrubber-track { position: relative; width: 100%; height: 7px; border-radius: 99px; background: rgba(120, 104, 82, 0.16); overflow: visible; }
.scrubber-store-bg { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px 0 0 99px; background: rgba(208, 101, 66, 0.14); }
.scrubber-recall-bg { position: absolute; right: 0; top: 0; bottom: 0; border-radius: 0 99px 99px 0; background: rgba(44, 131, 93, 0.14); }
.scrubber-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #e0815d); pointer-events: none; }
body.recall .scrubber-fill { background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 75%, var(--green) 76%, #45a378 100%); }
.scrubber-knob { position: absolute; top: 50%; left: 0%; width: 15px; height: 15px; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 2.5px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.2); pointer-events: none; }
body.recall .scrubber-knob { border-color: var(--green); }
.chap-tick { position: absolute; top: -2px; width: 2px; height: 11px; border-radius: 1px; background: rgba(255,255,255,0.85); pointer-events: none; }
.scrub-tip { position: absolute; bottom: 26px; transform: translateX(-50%); padding: 3px 9px; border-radius: 8px; background: var(--ink); color: #faf7f2; font-size: 11.5px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 120ms; }
.scrubber-wrap:hover .scrub-tip, .scrubber-wrap.dragging .scrub-tip { opacity: 1; }
.timecode { font: 600 11.5px/1 var(--mono); color: var(--muted); min-width: 72px; text-align: right; }

/* Deep Space 2D Theme */
body.space {
  --paper: #070b17;
  --glass: rgba(13, 19, 36, 0.82);
  --glass-strong: rgba(14, 21, 40, 0.90);
  --border: rgba(110, 162, 255, 0.22);
  --ink: #eef4ff;

  --subtle: #7689ae;
  --accent: #ff7e54;

body.space .brand-pill, body.space .chip-btn, body.space .cinema-deck { box-shadow: 0 14px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(155,198,255,0.12); }
body.space .hint-pan { background: rgba(13, 19, 36, 0.68); }
body.space .chip-btn.on { background: #3b82f6; color: #fff; border-color: #60a5fa; }
body.space .sub-body { color: #d6e2f7; }
body.space .sub-tip { background: rgba(40, 62, 112, 0.36); border: 1px solid rgba(110,162,255,0.14); }
body.space .pbtn { background: rgba(22, 31, 56, 0.92); color: #eef4ff; }
body.space .pbtn.primary { background: linear-gradient(135deg, #4b8bff, #6e5cff); color: #fff; border-color: transparent; }
body.space .scrubber-track { background: rgba(130, 168, 240, 0.18); }
body.space .scrubber-knob { background: #0e1528; border-color: #ff8e66; }
body.space.recall .scrubber-knob { border-color: #32df92; }
body.space .scrub-tip { background: #1d2b4e; color: #f0f6ff; border: 1px solid rgba(120,175,255,0.3); }
body.space .nollm-badge { background: rgba(24, 178, 112, 0.92); color: #03190f; }

/* ==================== MATH & EASING ==================== */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const remap = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => u * u * (3 - 2 * u);
const smoother = u => u * u * u * (u * (u * 6 - 15) + 10);
const easeOutBack = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeInOutCubic = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

function quadPt(p0, p1, p2, u) {
  const m = 1 - u;
  return {
    x: m * m * p0.x + 2 * m * u * p1.x + u * u * p2.x,
    y: m * m * p0.y + 2 * m * u * p1.y + u * u * p2.y
  };
}
function quadTan(p0, p1, p2, u) {
  const dx = 2 * (1 - u) * (p1.x - p0.x) + 2 * u * (p2.x - p1.x);
  const dy = 2 * (1 - u) * (p1.y - p0.y) + 2 * u * (p2.y - p1.y);
  return Math.atan2(dy, dx);
}

/* ==================== 2.5D CANVAS DRAWING PRIMITIVES ==================== */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

function roundRectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// Kurzgesagt 2.5D Thick-Edged Block (drop shadow + dark extruded side + crisp main face + top highlight)
function block25D(x, y, w, h, r, topCol, sideCol, depth = 10, strokeCol = null) {
  const pal = P();
  // Grounded soft shadow
  ctx.save();
  ctx.fillStyle = pal.shadow;
  roundRectPath(x + 3, y + depth + 6, w, h, r);
  ctx.fill();
  // Extruded bottom thickness
  ctx.fillStyle = sideCol;
  roundRectPath(x, y + depth, w, h, r);
  ctx.fill();
  // Main top face
  ctx.fillStyle = topCol;
  roundRectPath(x, y, w, h, r);
  ctx.fill();
  if (strokeCol) {
    ctx.strokeStyle = strokeCol;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // Subtle upper bevel highlight
  ctx.strokeStyle = currentTheme === "space" ? "rgba(180,215,255,0.16)" : "rgba(255,255,255,0.65)";
  ctx.lineWidth = 1.5;
  roundRectPath(x + 1, y + 1, w - 2, h - 2, Math.max(2, r - 1));
  ctx.stroke();
  ctx.restore();
}

function drawGlow(x, y, r, rgbaCenter) {
  const g = ctx.createRadialGradient(x, y, 2, x, y, r);
  g.addColorStop(0, rgbaCenter);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function drawIconBadge(key, cx, cy, size, bg = "#ffffff") {
  const r = size * 0.24;
  const x = cx - size / 2, y = cy - size / 2;
  block25D(x, y, size, size, r, bg, currentTheme === "space" ? "#0c1324" : "#d8d0c0", 5, currentTheme === "space" ? "rgba(140,185,255,0.35)" : "rgba(120,104,82,0.18)");
  const im = IMGS[key];
  if (im && im.complete && im.naturalWidth > 0) {
    ctx.save();
    const pad = (key === "memlane" || key === "cognee" || key === "codex") ? size * 0.08 : size * 0.14;
    roundRectPath(x + pad, y + pad, size - pad * 2, size - pad * 2, r * 0.72);
    ctx.clip();
    ctx.drawImage(im, x + pad, y + pad, size - pad * 2, size - pad * 2);
    ctx.restore();
  }
}

function drawPill(cx, cy, text, { bg, fg, border, icon = null, icon2 = null, font = "650 16px -apple-system, PingFang SC, sans-serif", padX = 14, h = 34 } = {}) {
  ctx.save();
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  const icW = (icon ? 24 : 0) + (icon2 ? 22 : 0);
  const w = tw + padX * 2 + icW;
  const x = cx - w / 2, y = cy - h / 2;
  ctx.fillStyle = P().shadow;
  roundRectPath(x, y + 3, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = bg || P().card;
  roundRectPath(x, y, w, h, h / 2);
  ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 1.5; ctx.stroke(); }
  let tx = x + padX;
  if (icon && IMGS[icon] && IMGS[icon].complete) {
    ctx.save(); roundRectPath(tx, cy - 10, 20, 20, 5); ctx.clip();
    ctx.drawImage(IMGS[icon], tx, cy - 10, 20, 20); ctx.restore();
    tx += 24;
  }
  if (icon2 && IMGS[icon2] && IMGS[icon2].complete) {
    ctx.save(); roundRectPath(tx, cy - 10, 20, 20, 5); ctx.clip();
    ctx.drawImage(IMGS[icon2], tx, cy - 10, 20, 20); ctx.restore();
    tx += 22;
  }
  ctx.fillStyle = fg || P().ink;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillText(text, tx, cy + 0.5);
  ctx.restore();
}

function drawCrystal(cx, cy, r, rot, col1, col2) {
  ctx.save();
  ctx.translate(cx, cy);
  if (currentTheme === "space") drawGlow(0, 0, r * 2.4, "rgba(255,126,76,0.45)");
  ctx.rotate(Math.sin(rot) * 0.14);
  // Left facet
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(-r * 0.78, 0); ctx.lineTo(0, r); ctx.closePath();
  ctx.fillStyle = col1; ctx.fill();
  // Right facet
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(r * 0.78, 0); ctx.lineTo(0, r); ctx.closePath();
  ctx.fillStyle = col2; ctx.fill();
  // Upper highlight facet
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(-r * 0.35, -r * 0.1); ctx.lineTo(0, r * 0.15); ctx.lineTo(r * 0.35, -r * 0.1); ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,0.34)"; ctx.fill();
  ctx.restore();
}

function drawArrowCurve(p0, p1, p2, progress, color, width = 5, dashed = false) {
  if (progress <= 0.01) return;
  const steps = Math.max(4, Math.floor(32 * clamp01(progress)));
  ctx.save();
  ctx.beginPath();
  for (let i = 0; i <= steps; i++) {
    const u = (i / steps) * clamp01(progress);
    const pt = quadPt(p0, p1, p2, u);
    if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  if (dashed) ctx.setLineDash([10, 9]);
  ctx.stroke();
  ctx.setLineDash([]);
  // Arrowhead
  if (progress > 0.18) {
    const uEnd = clamp01(progress);
    const tip = quadPt(p0, p1, p2, uEnd);
    const ang = quadTan(p0, p1, p2, uEnd);
    ctx.translate(tip.x, tip.y);
    ctx.rotate(ang);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(6, 0); ctx.lineTo(-12, -8); ctx.lineTo(-8, 0); ctx.lineTo(-12, 8); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawDottedArc(p0, p1, p2, headU, color, count = 14) {
  ctx.save();
  for (let i = 1; i <= count; i++) {
    const du = headU - i * 0.036;
    if (du <= 0 || du >= 1) continue;
    const pt = quadPt(p0, p1, p2, du);
    const rad = lerp(6.5, 2.2, i / count);
    ctx.fillStyle = color;
    ctx.globalAlpha = lerp(0.95, 0.15, i / count);
    ctx.beginPath(); ctx.arc(pt.x, pt.y, rad, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawGear(cx, cy, r, teeth, angle, fillCol, strokeCol) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.beginPath();
  for (let i = 0; i < teeth * 2; i++) {
    const a = (i / (teeth * 2)) * Math.PI * 2;
    const rad = i % 2 === 0 ? r : r * 0.78;
    const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = fillCol; ctx.fill();
  if (strokeCol) { ctx.strokeStyle = strokeCol; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.36, 0, Math.PI * 2);
  ctx.fillStyle = P().card; ctx.fill();
  ctx.restore();
}

function wrapCanvasText(txt, x, y, maxW, lh) {
  let line = "", cy = y;
  for (const ch of txt) {
    if (ctx.measureText(line + ch).width > maxW) {
      ctx.fillText(line, x, cy); line = ch; cy += lh;
    } else line += ch;
  }
  if (line) ctx.fillText(line, x, cy);
}

  drawIconBadge("ladybug", 2018, 502, 56, "#ffffff");
  ctx.fillStyle = pal.ink; ctx.font = "700 20px Georgia, Songti SC, serif"; ctx.textAlign = "left";
  ctx.fillText("图数据库 Ladybug", 2060, 496);
  ctx.fillStyle = pal.muted; ctx.font = "500 12.5px -apple-system, sans-serif";
  ctx.fillText("实体是点，关系是线，擅长顺藤摸瓜", 2060, 518);

  // Subtle circular stage ring inside Ladybug card
  ctx.strokeStyle = pal.ladyRim; ctx.lineWidth = 2; ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.ellipse(2190, 665, 195, 118, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;

  // Edges grow sequentially (46.8 -> 50.0)
  G_EDGES.forEach((e, i) => {
    const u = smooth(remap(t, 46.8 + i * 0.75, 48.2 + i * 0.75));
    if (u <= 0.01) return;
    const a = G_NODES[e.from], b = G_NODES[e.to];
    const ang = Math.atan2(b.y - a.y, b.x - a.x);
    const p0 = { x: a.x + Math.cos(ang) * 30, y: a.y + Math.sin(ang) * 30 };
    const p2 = { x: b.x - Math.cos(ang) * 34, y: b.y - Math.sin(ang) * 34 };
    const p1 = { x: (a.x + b.x) / 2 + e.bend.x, y: (a.y + b.y) / 2 + e.bend.y };
    const hot = ((i === 0 && t >= 67.0) || (i === 1 && t >= 67.8)) && t < 75.5;
    drawArrowCurve(p0, p1, p2, u, hot ? pal.green : pal.violet, hot ? 7 : 4.5, false);
    if (u > 0.55) {
      const mid = quadPt(p0, p1, p2, 0.5);
      drawPill(mid.x, mid.y - 12, e.label, {
        bg: hot ? pal.green : (sp ? "#2a1d4f" : "#f4efff"),
        fg: hot ? (sp ? "#03190f" : "#fff") : (sp ? "#d4c0ff" : "#5e43a0"),
        border: hot ? pal.green : pal.violet,
        font: "700 12px -apple-system, sans-serif", h: 24, padX: 9
      });
    }
  });

  // Nodes pop in (45.8 -> 48.0)
  G_NODES.forEach((n, i) => {
    const uPop = easeOutBack(remap(t, 45.8 + i * 0.48, 46.5 + i * 0.48));
    if (uPop <= 0.02) return;
    const hot = ((i === 0 && t >= 66.6) || (i === 1 && t >= 67.4) || (i === 2 && t >= 68.1)) && t < 75.5;
    const ny = n.y + Math.sin(t * 2.2 + i * 1.6) * 4;
    ctx.save();
    ctx.translate(n.x, ny);
    ctx.scale(uPop, uPop);
    if (sp || hot) drawGlow(0, 0, hot ? 58 : 42, hot ? "rgba(50,223,146,0.55)" : "rgba(50,223,146,0.28)");
    ctx.fillStyle = pal.greenSide; ctx.beginPath(); ctx.arc(0, 5, 25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = hot ? "#34e89a" : pal.green; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.32)"; ctx.beginPath(); ctx.arc(-7, -8, 8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    drawPill(n.x, ny + 38, n.name, {
      bg: hot ? pal.green : pal.card,
      fg: hot ? (sp ? "#03190f" : "#fff") : pal.ink,
      border: hot ? pal.green : pal.green,
      font: "700 12.5px -apple-system, sans-serif", h: 26, padX: 10
    });
  });

  // ==================== ZONE 5C: LANCEDB 2D PARALLAX VECTOR SPACE (x=1965..2430, y=855..1185) ====================
  block25D(1965, 855, 465, 330, 26, pal.vecBg, pal.vecSide, 12, pal.vecBorder);
  drawIconBadge("lancedb", 2018, 902, 52, "#ffffff");
  ctx.fillStyle = pal.ink; ctx.font = "700 19px Georgia, Songti SC, serif"; ctx.textAlign = "left";
  ctx.fillText("向量数据库 LanceDB", 2056, 896);
  ctx.fillStyle = pal.muted; ctx.font = "500 12px -apple-system, sans-serif";
  ctx.fillText("意思越接近，坐标点离得越近", 2056, 916);

  // Subtle clamped parallax + clip inside LanceDB starfield viewport so stars never overlap the title/icon or escape the box!
  const pxFar = Math.max(-18, Math.min(18, (cam.cx - 2195) * 0.03));
  const pyFar = Math.max(-12, Math.min(12, (cam.cy - 1040) * 0.03));
  ctx.save();
  roundRectPath(1974, 938, 447, 240, 18);
  ctx.clip();

  // Coordinate axes inside LanceDB
  ctx.save();
  ctx.strokeStyle = pal.vecBorder; ctx.globalAlpha = 0.25; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(1995, 1040); ctx.lineTo(2405, 1040); ctx.moveTo(2195, 946); ctx.lineTo(2195, 1170); ctx.stroke();
  ctx.restore();

  // Distant old stars (far parallax layer)
  OLD_STARS.forEach((s, i) => {
    const sx = s.x + pxFar, sy = s.y + pyFar + Math.sin(t * 1.4 + i) * 2.5;

  // Expanding 2D Concentric Radar Waves during Recall (64.6 -> 67.2)
  const uRadar = remap(t, 64.6, 67.2);

    for (let ring = 0; ring < 3; ring++) {
      const ru = clamp01(uRadar * 1.35 - ring * 0.18);

      ctx.save();
      ctx.strokeStyle = pal.green;
      ctx.globalAlpha = (1 - ru) * 0.78;

      ctx.restore();

  // Cosine Similarity Tether Lines during Recall (65.0 -> 75.5)
  const uTether = smooth(remap(t, 65.0, 66.0));
  if (uTether > 0.01 && t < 75.5) {
    NEW_STARS.filter(s => s.near).forEach(s => {
      const ex = lerp(QUERY_STAR.x, s.x, uTether), ey = lerp(QUERY_STAR.y, s.y, uTether);

      ctx.strokeStyle = pal.green; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.moveTo(QUERY_STAR.x, QUERY_STAR.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.restore();
      if (uTether > 0.8) {
        const mx = (QUERY_STAR.x + s.x) / 2, my = (QUERY_STAR.y + s.y) / 2;

  // New Semantic Cluster Stars (pop in at 52.3 -> 55.8)
  NEW_STARS.forEach((s, i) => {
    const uPop = easeOutBack(remap(t, 52.3 + i * 0.35, 53.0 + i * 0.35));
    if (uPop <= 0.02) return;

  // Recall Query Star inside LanceDB
  const qPop = easeOutBack(remap(t, 64.3, 65.0));
  if (qPop > 0.02) {
    drawGlow(QUERY_STAR.x, QUERY_STAR.y, 44, "rgba(50,223,146,0.62)");

    ctx.beginPath(); ctx.arc(QUERY_STAR.x, QUERY_STAR.y, 13 * qPop, 0, Math.PI * 2); ctx.fill();

    drawPill(QUERY_STAR.x, QUERY_STAR.y + 28, "你的问题", { bg: pal.green, fg: sp ? "#03190f" : "#fff", font: "700 11.5px -apple-system, sans-serif", h: 22, padX: 8 });

  ctx.restore();

  // ==================== CROSS-ZONE FLYING PARTICLES & ARCS ====================
  // A. Paper Airplane (Codex -> Memlane: 10.8 -> 13.8)
  const uPlane = remap(t, 10.8, 13.8);
  if (uPlane > 0 && uPlane < 1) {
    const e = easeInOutCubic(uPlane);
    const p0 = { x: 420, y: 635 }, p1 = { x: 540, y: 405 }, p2 = { x: 642, y: 696 };

    const pt = quadPt(p0, p1, p2, e);
    const ang = quadTan(p0, p1, p2, e);
    const sc = uPlane < 0.12 ? easeOutBack(uPlane / 0.12) : uPlane > 0.88 ? 1 - (uPlane - 0.88) / 0.12 : 1;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(ang);
    ctx.scale(sc, sc);
    if (sp) drawGlow(0, 0, 44, "rgba(255,140,86,0.5)");
    // Crisp 2D origami paper airplane
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = pal.accent; ctx.lineWidth = 2.5; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(-20, -18); ctx.lineTo(-10, 0); ctx.lineTo(-20, 18); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = pal.accent;
    ctx.beginPath(); ctx.moveTo(28, 0); ctx.lineTo(-10, 0); ctx.lineTo(-16, 10); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // B. Archival Copy Raw -> SQLite (20.6 -> 22.7)
  const uCopyRaw = remap(t, 20.6, 22.7);
  if (uCopyRaw > 0 && uCopyRaw < 1) {
    const e = easeInOutCubic(uCopyRaw);
    const p0 = { x: 1085, y: 600 }, p1 = { x: 1480, y: 240 }, p2 = { x: 2042, y: 270 };
    drawDottedArc(p0, p1, p2, e, pal.cyan, 14);
    const pt = quadPt(p0, p1, p2, e);
    block25D(pt.x - 24, pt.y - 14, 48, 28, 7, pal.cyan, pal.blueSide, 4);

  // C. Experience Crystal Copy -> SQLite (26.5 -> 29.1)
  const uCopyExp = remap(t, 26.5, 29.1);
  if (uCopyExp > 0 && uCopyExp < 1) {
    const e = easeInOutCubic(uCopyExp);
    const p0 = { x: 1270, y: 565 }, p1 = { x: 1650, y: 220 }, p2 = { x: 2150, y: 325 };
    drawDottedArc(p0, p1, p2, e, pal.accent, 14);
    const pt = quadPt(p0, p1, p2, e);
    drawCrystal(pt.x, pt.y, 20, e * 10, "#ff875c", "#c84a22");
    drawPill(pt.x, pt.y - 32, "💎 经验副本 → SQLite", { bg: pal.card, fg: pal.ink, border: pal.accent, font: "700 12px -apple-system, sans-serif", h: 25, padX: 9 });
  }

  // D. Ch7: Cut Chunks -> UP INTO GPT Pod (43.5 -> 46.4)
  const uChunkIn = smooth(remap(t, 43.5, 44.5)) * (1 - smooth(remap(t, 46.2, 47.0)));
  if (uChunkIn > 0.01) {
    const p0 = { x: 1640, y: 602 }, p1 = { x: 1610, y: 380 }, p2 = { x: 1455, y: podY + 54 };
    drawArrowCurve(p0, p1, p2, uChunkIn, pal.amber, 5, true);
    const up = remap(t, 43.6, 45.2);
    if (up > 0 && up < 1) {
      const pt = quadPt(p0, p1, p2, easeInOutCubic(up));
      block25D(pt.x - 18, pt.y - 12, 36, 24, 6, pal.amber, pal.amberSide, 4);
    }
    if (t < 46.2) drawPill(1540, 446, "📤 段落送给 GPT 读", { bg: pal.card, fg: pal.ink, border: pal.amber, font: "700 12px -apple-system, sans-serif", h: 26, padX: 10 });
  }

  // E. Ch7: 3 Emerald Entity Orbs burst OUT OF GPT Pod -> Ladybug (44.6 -> 47.6)
  G_NODES.forEach((n, i) => {
    const uFly = remap(t, 44.6 + i * 0.48, 46.05 + i * 0.48);
    if (uFly > 0 && uFly < 1) {
      const e = easeInOutCubic(uFly);
      const p0 = { x: 1482, y: podY + 12 }, p1 = { x: 1840, y: 260 + i * 70 }, p2 = { x: n.x, y: n.y };
      drawDottedArc(p0, p1, p2, e, pal.green, 10);
      const pt = quadPt(p0, p1, p2, e);
      if (sp) drawGlow(pt.x, pt.y, 32, "rgba(50,223,146,0.55)");
      ctx.fillStyle = pal.green; ctx.beginPath(); ctx.arc(pt.x, pt.y, 13, 0, Math.PI * 2); ctx.fill();
    }
  });
  if (t >= 44.7 && t < 47.4) {
    drawPill(1770, 355, "GPT 读出实体与关系 → 飞入 Ladybug", { bg: pal.violet, fg: "#fff", icon: "openai", font: "700 12.5px -apple-system, sans-serif", h: 28, padX: 11 });
  }

  // F. Ch8: Vector Orbs launch from Vector Lens -> LanceDB (51.2 -> 56.2)
  NEW_STARS.forEach((s, i) => {
    const uFly = remap(t, 51.2 + i * 0.35, 52.5 + i * 0.35);
    if (uFly > 0 && uFly < 1) {
      const e = easeInOutCubic(uFly);
      const p0 = { x: 1715, y: 748 }, p1 = { x: 1930, y: 840 + i * 25 }, p2 = { x: s.x, y: s.y };
      drawDottedArc(p0, p1, p2, e, s.col, 9);
      const pt = quadPt(p0, p1, p2, e);
      ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, 9, 0, Math.PI * 2); ctx.fill();
    }
  });

  // G. Recall Comet: Codex -> Memlane -> Vector Lens -> LanceDB (59.0 -> 64.5)
  const uC1 = remap(t, 59.0, 60.4), uC2 = remap(t, 63.0, 64.5);
  if (uC1 > 0 && uC1 < 1) {
    const p0 = { x: 450, y: 630 }, p1 = { x: 560, y: 540 }, p2 = { x: 690, y: 640 };
    const e = easeInOutCubic(uC1);
    drawDottedArc(p0, p1, p2, e, pal.green, 12);
    const pt = quadPt(p0, p1, p2, e);
    drawGlow(pt.x, pt.y, 38, "rgba(50,223,146,0.65)");
    ctx.fillStyle = pal.green; ctx.beginPath(); ctx.arc(pt.x, pt.y, 13, 0, Math.PI * 2); ctx.fill();
  }
  if (uC2 > 0 && uC2 < 1) {
    const p0 = { x: 1715, y: 748 }, p1 = { x: 1960, y: 860 }, p2 = { x: QUERY_STAR.x, y: QUERY_STAR.y };
    const e = easeInOutCubic(uC2);
    drawDottedArc(p0, p1, p2, e, pal.green, 14);
    const pt = quadPt(p0, p1, p2, e);
    drawGlow(pt.x, pt.y, 40, "rgba(50,223,146,0.65)");
    ctx.fillStyle = pal.green; ctx.beginPath(); ctx.arc(pt.x, pt.y, 13, 0, Math.PI * 2); ctx.fill();
  }

  // H. Recall Cross-DB Signal: LanceDB -> Ladybug -> SQLite
  if (t >= 66.0 && t < 75.5) {
    drawArrowCurve({ x: 2115, y: 980 }, { x: 1985, y: 800 }, { x: 2048, y: 618 }, smooth(remap(t, 66.0, 67.0)), pal.green, 5, false);
  }
  if (t >= 68.0 && t < 75.5) {
    drawArrowCurve({ x: 2210, y: 560 }, { x: 2260, y: 455 }, { x: 2210, y: 382 }, smooth(remap(t, 68.0, 69.0)), pal.green, 4.5, false);
  }

  // I. Finale Emerald Return Ribbon back over the entire factory to Codex (70.5 -> 76.0)
  const uRet = smooth(remap(t, 70.5, 72.5));
  if (uRet > 0.01) {
    const p0 = { x: 1965, y: 645 }, p1 = { x: 1210, y: 260 }, p2 = { x: 470, y: 640 };
    drawArrowCurve(p0, p1, p2, uRet, pal.green, 7, false);
    if (uRet < 0.99) {
      const pt = quadPt(p0, p1, p2, uRet);
      drawGlow(pt.x, pt.y, 46, "rgba(50,223,146,0.7)");
      ctx.fillStyle = pal.green; ctx.beginPath(); ctx.arc(pt.x, pt.y, 15, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ==================== VIRTUAL 2D CAMERA + PAN/ZOOM + TIMELINE ==================== */
let dpr = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(window.innerWidth * dpr);
  canvas.height = Math.round(window.innerHeight * dpr);
}
resize();
addEventListener("resize", resize);

function directorCamAt(t) {
  let idx = 0;
  for (let i = CHAPTERS.length - 1; i >= 0; i--) {
    if (t >= CHAPTERS[i].start) { idx = i; break; }
  }
  const c0 = CHAPTERS[idx], c1 = CHAPTERS[Math.min(CHAPTERS.length - 1, idx + 1)];
  let cx = c0.cam.cx, cy = c0.cam.cy, zoom = c0.cam.zoom;
  // Two-stage tracking inside Ch4 (follow crystal to SQLite), Ch7 (swoop into Ladybug) & Ch10 (radar closeup -> 3-DB chain + sleeping GPT)
  if (idx === 4) {
    const u = smoother(remap(t, 26.0, 27.8));
    cx = lerp(cx, 1740, u); cy = lerp(cy, 430, u); zoom = lerp(zoom, 0.74, u);
  } else if (idx === 7) {
    const u = smoother(remap(t, 46.6, 48.2));
    cx = lerp(cx, 2195, u); cy = lerp(cy, 635, u); zoom = lerp(zoom, 1.25, u);
  } else if (idx === 10) {
    const u = smoother(remap(t, 66.2, 67.6));
    cx = lerp(cx, 1980, u); cy = lerp(cy, 625, u); zoom = lerp(zoom, 0.61, u);
  }
  const blend = idx < CHAPTERS.length - 1 ? smoother(remap(t, c0.end - 1.25, c0.end + 0.15)) : 0;
  // Auto-fit base scale to viewport width (baseline 1440px)
  const fit = Math.min(window.innerWidth / 1440, (window.innerHeight - 160) / 720);
  return {
    cx: lerp(cx, c1.cam.cx, blend),
    cy: lerp(cy, c1.cam.cy, blend),
    zoom: lerp(zoom, c1.cam.zoom, blend) * Math.max(0.65, fit)
  };
}

const camCurr = { cx: 1250, cy: 620, zoom: 0.52 };
let panX = 0, panY = 0, userZoom = 1.0, dragging = false, prevX = 0, prevY = 0;

canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  dragging = true; prevX = e.clientX; prevY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  panX -= (e.clientX - prevX) / camCurr.zoom;
  panY -= (e.clientY - prevY) / camCurr.zoom;
  prevX = e.clientX; prevY = e.clientY;
});
canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  userZoom = Math.max(0.55, Math.min(2.2, userZoom * (e.deltaY > 0 ? 0.92 : 1.08)));
}, { passive: false });

/* ==================== PLAYER UI ==================== */
const $ = id => document.getElementById(id);
let curT = 0.0, playing = false, speed = 1.0, speedIdx = 1, lastChapId = -1;
const SPEEDS = [0.75, 1, 1.5];

$("scrub-store-bg").style.width = (RECALL_T / TOTAL * 100) + "%";
$("scrub-recall-bg").style.width = ((TOTAL - RECALL_T) / TOTAL * 100) + "%";
CHAPTERS.forEach((c, i) => {
  if (i === 0) return;
  const tick = document.createElement("i");
  tick.className = "chap-tick";
  tick.style.left = (c.start / TOTAL * 100) + "%";
  $("scrub-track").appendChild(tick);
});

const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function syncUI() {
  const ch = getChapter(curT);
  const pct = (curT / TOTAL) * 100;
  $("scrub-fill").style.width = pct + "%";
  $("scrub-knob").style.left = pct + "%";
  $("timecode").textContent = `${fmt(curT)} / ${fmt(TOTAL)}`;
  document.body.classList.toggle("recall", curT >= RECALL_T);
  if (ch.id !== lastChapId) {
    lastChapId = ch.id;
    $("phase-badge").textContent = ch.phase;
    $("sub-step").textContent = ch.step;
    $("sub-title").textContent = ch.title;
    $("sub-body").textContent = ch.body;
    $("sub-tip").innerHTML = ch.tip;
    $("sub-tech").textContent = "源码对应：" + ch.tech;
  }
  $("btn-play").textContent = playing ? "❚❚ 暂停" : (curT >= TOTAL - 0.1 ? "↻ 重播" : "▶ 播放");
  $("btn-to-3d").href = `index.html#theme=${currentTheme}&t=${curT.toFixed(1)}`;
}

function setPlay(on) {
  playing = on;
  if (on) {
    panX *= 0.2; panY *= 0.2; userZoom = 1.0;
    if (curT >= TOTAL - 0.2 || curT < 0.1) curT = CHAPTERS[1].start;
  }
  syncUI();
}
function applyTheme(mode) {
  currentTheme = mode === "space" ? "space" : "light";
  const sp = currentTheme === "space";
  document.body.classList.toggle("space", sp);
  $("btn-theme").textContent = sp ? "☀️ 浅色插画" : "🌌 深空科技";
  $("btn-theme").classList.toggle("on", sp);
  syncUI();
}

$("btn-play").onclick = () => setPlay(!playing);
$("btn-prev").onclick = () => {
  const ch = getChapter(curT);
  curT = (curT - ch.start > 1.2) ? ch.start : CHAPTERS[Math.max(0, ch.id - 1)].start;
  syncUI();
};
$("btn-next").onclick = () => {
  const ch = getChapter(curT);
  curT = CHAPTERS[Math.min(CHAPTERS.length - 1, ch.id + 1)].start;
  syncUI();
};
$("btn-speed").onclick = () => { speedIdx = (speedIdx + 1) % SPEEDS.length; speed = SPEEDS[speedIdx]; $("btn-speed").textContent = speed + "×"; };
$("btn-tech").onclick = e => { const on = document.body.classList.toggle("tech"); e.currentTarget.classList.toggle("on", on); };
$("btn-theme").onclick = () => applyTheme(currentTheme === "space" ? "light" : "space");
$("btn-reset-cam").onclick = () => { panX = 0; panY = 0; userZoom = 1.0; };

let scrubbing = false;
function scrubFromEvent(e) {
  const r = $("scrub-track").getBoundingClientRect();
  const u = clamp01((e.clientX - r.left) / r.width);
  const tH = u * TOTAL, ch = getChapter(tH);
  $("scrub-tip").style.left = (u * 100) + "%";
  $("scrub-tip").textContent = `${ch.step} · ${fmt(tH)}`;
  if (scrubbing) { curT = tH; syncUI(); }
}
$("scrubber").addEventListener("pointerdown", e => { scrubbing = true; $("scrubber").classList.add("dragging"); $("scrubber").setPointerCapture(e.pointerId); scrubFromEvent(e); });
$("scrubber").addEventListener("pointermove", scrubFromEvent);
$("scrubber").addEventListener("pointerup", () => { scrubbing = false; $("scrubber").classList.remove("dragging"); });

addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); setPlay(!playing); }
  else if (e.key === "ArrowRight") $("btn-next").click();
  else if (e.key === "ArrowLeft") $("btn-prev").click();
  else if (e.key === "r" || e.key === "R") $("btn-reset-cam").click();
});

// Init from URL params / hash
let snapFirst = true;
const qsTheme = new URLSearchParams(location.search).get("theme");
const hashTheme = location.hash.match(/theme=([a-z]+)/);
const hashT = location.hash.match(/t=([\d.]+)/);
const hashC = location.hash.match(/c=(\d+)/);
if (hashT) curT = Math.max(0, Math.min(TOTAL, parseFloat(hashT[1])));
else if (hashC) {
  const ch = CHAPTERS[Math.min(CHAPTERS.length - 1, parseInt(hashC[1], 10))];
  curT = ch.start + (ch.end - ch.start) * 0.62;
}
applyTheme((qsTheme || (hashTheme && hashTheme[1]) || "light").toLowerCase());

let prevNow = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - prevNow) / 1000);
  prevNow = now;
  if (playing && !scrubbing) {
    curT += dt * speed;
    if (curT >= TOTAL) { curT = TOTAL; playing = false; }
    syncUI();
  }
  const d = directorCamAt(curT);
  const targetCx = d.cx + panX, targetCy = d.cy + panY, targetZ = d.zoom * userZoom;
  if (snapFirst) {
    camCurr.cx = targetCx; camCurr.cy = targetCy; camCurr.zoom = targetZ;
    snapFirst = false;
  } else {
    const k = 1 - Math.exp(-7.0 * dt);
    camCurr.cx = lerp(camCurr.cx, targetCx, k);
    camCurr.cy = lerp(camCurr.cy, targetCy, k);
    camCurr.zoom = lerp(camCurr.zoom, targetZ, k);
  }
  drawWorld(curT, camCurr);
}
requestAnimationFrame(loop);
</script>
</body>
